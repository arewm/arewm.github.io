name: Build and Deploy with SLSA Provenance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.hash.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Create tarball of site
        run: |
          tar -czf site.tar.gz -C _site .

      - name: Generate artifact hash
        id: hash
        run: |
          set -euo pipefail
          sha256=$(sha256sum site.tar.gz | awk '{print $1}')
          echo "digest=sha256:$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3

      - name: Upload tarball for provenance
        uses: actions/upload-artifact@v4
        with:
          name: site-artifact
          path: site.tar.gz
          if-no-files-found: error

  # Generate SLSA provenance
  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.artifact-digest }}"
      upload-assets: true
      provenance-name: "site.intoto.jsonl"

  # Deploy to GitHub Pages
  deploy:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
